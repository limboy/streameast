<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBA</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="titlebar-controls">
        <select id="source-select" class="source-select" aria-label="Streaming source"></select>
        <button id="refresh" class="titlebar-btn" aria-label="Refresh">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/>
            <path d="M13.5 2.5v3h-3"/>
          </svg>
          <span id="refresh-tooltip" class="refresh-tooltip"></span>
        </button>
      </div>
    </header>

    <p id="error" class="error" hidden></p>
    <main id="games"></main>

    <section id="schedule">
      <h2>Schedule</h2>
      <div id="days"><p class="muted">Loading the schedule…</p></div>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
